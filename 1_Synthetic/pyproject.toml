[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcmlq-synthetic"
version = "0.1.0"
description = "Controlled RC-MLQ preference-learning experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "PyYAML>=6", "threadpoolctl>=3.1"]

[project.optional-dependencies]
reference = ["torch>=2.5"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["rcmlq_synthetic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
