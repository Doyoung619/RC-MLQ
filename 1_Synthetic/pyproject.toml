[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pscore-experiment-harness"
version = "0.1.0"
description = "Reproducible synthetic and OpenML semi-synthetic experiments for Hard/Soft Projected Score active GLM estimation."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "tqdm>=4.66",
  "cvxpy>=1.7.5",
  "scs>=3.2",
  "clarabel>=0.11",
  "threadpoolctl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pscore-harness = "pscore_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
